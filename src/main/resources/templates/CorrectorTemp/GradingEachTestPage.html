<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
>
<head>
    <meta charset="UTF-8">
    <title>Title</title>
    <link rel="stylesheet" href="/css/styles.css">

</head>
<body>
<form method="post"
      th:action="@{/correctorDashBoard/{testId}/{username}/gradingTheTest(testId=${testId}, username=${username})}"
      th:object="${testResult}">
    <div th:each="i, stat : ${#numbers.sequence(0, questions.size() - 1)}">
        <!-- Display the question -->
        <h3 th:text="${questions[i].getQuestionText()}"></h3>

        <!-- Display the user's original answer -->
        <h4>Submitted Answer: <span th:text="${answers[i].getAnswerText()}"></span></h4>

        <!-- Input field for the corrected answer -->
        <label for="correctedAnswer">Corrected Answer:</label>
        <input type="text" id="correctedAnswer"
               th:field="*{answers[i].correctedAnswer}"
               placeholder="Enter the correct answer (if incorrect)" required>
    </div>

    <!-- Submit and Cancel buttons -->
    <button type="submit" class="btn btn-primary">Submit</button>
    <a th:href="@{/correctorDashBoard/{testId}/gradingTheTest(testId=${testId})}">
        <button type="button">Cancel</button>
    </a>
</form></body>
</html>
