<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
>
<head>
    <meta charset="UTF-8">
    <title>Title</title>
    <link rel="stylesheet" href="/css/styles.css">

</head>
<body>
<h1>
    <strong>Test ID:</strong> <span th:text="${testId}"></span>
    <strong> || Taken By:</strong> <span th:text="${username}"></span>
</h1>

<br><br><br>

<!-- Loop through all questions and display their answers and input fields for corrected answers -->
<form method="post" th:action="@{/correctorDashBoard/{testId}/{username}/gradingTheTest(testId=${testId}, username=${username})}">

    <!-- Loop through all questions -->
    <div th:each="i, stat : ${#numbers.sequence(0, totalQuestions - 1)}">

        <!-- Display the question -->
        <h2 th:text="${questions[i].getQuestionText()}"></h2>

        <!-- Display the original answer -->
        <h3>Submitted Answer: <span th:text="${answers[i].getAnswerText()}"></span></h3>

        <div>
            <label for="tentacles">Points to be given (0-10):</label>
            <input type="number"
                   id="tentacles"
                   th:name="totalPoints"
                   th:value="${totalPoints[stat.index]}"
                   min="0" max="10" required />
        </div>


        <!-- Corrected answer input field -->
        <label for="correctedAnswer${i}">

        </label><input type="text"
            id="correctedAnswer${i}"
            name="correctedAnswers"
            th:value="${correctedAnswers[i]}"
            placeholder="Enter the correct answer"
            required />

        <br><br>
    </div>

    <!-- Submit all corrected answers at once -->
    <button type="submit" class="btn btn-primary">Submit All</button>
</form>



</body>
</html>
