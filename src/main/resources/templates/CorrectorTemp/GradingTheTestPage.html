<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
>
<head>
    <meta charset="UTF-8">
    <title>Test Results Page</title>
    <link rel="stylesheet" href="/css/styles.css">

</head>
<body>
    <table>
        <thead>
            <tr>
                <th>Test Name</th>
                <th>Test ID</th>
                <th>Take By</th>
                <th>Score</th>
                <th>Passed</th>
                <th>Options</th>
            </tr>
        </thead>

        <tbody th:remove="all-but-first">
            <tr th:each="submitted : ${submittedList}">

                <td th:text="${test.testName}">Test Name</td>
                <td th:text="${submitted.testId}">Test ID</td>
                <td th:text="${submitted.takenBy}">Taken By</td>
                <td th:text="${submitted.grade}">Current Score</td>
                <td th:text="${submitted.passed}">Test State</td>
                <td>
                    <a th:href="@{/correctorDashBoard/{testId}/{username}/gradingTheTest(testId=${submitted.testId},username=${submitted.takenBy})}">
                        <button type="button"> Correction </button>
                    </a>
                </td>
            </tr>
        </tbody>
    </table>
</body>
</html>
